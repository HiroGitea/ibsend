<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 250" role="img" aria-labelledby="title desc">
  <title id="title">ibsend data path</title>
  <desc id="desc">Files move through registered memory and a single RC queue pair into receiver RAM, then drain to disk</desc>
  <defs>
    <linearGradient id="line" x1="250" y1="0" x2="710" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#f97316"/>
      <stop offset="1" stop-color="#8b5cf6"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-30%" width="140%" height="160%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#020617" flood-opacity=".28"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 10 5 0 10Z" fill="#8b5cf6"/>
    </marker>
    <marker id="arrow-orange" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 10 5 0 10Z" fill="#f97316"/>
    </marker>
  </defs>
  <rect width="960" height="250" rx="22" fill="#0f172a"/>
  <text x="70" y="43" fill="#94a3b8" font-family="ui-sans-serif,system-ui,sans-serif" font-size="15" font-weight="700" letter-spacing="1.8">SENDER</text>
  <text x="760" y="43" fill="#94a3b8" font-family="ui-sans-serif,system-ui,sans-serif" font-size="15" font-weight="700" letter-spacing="1.8">RECEIVER</text>
  <g filter="url(#shadow)">
    <rect x="42" y="68" width="170" height="116" rx="16" fill="#1e293b" stroke="#334155"/>
    <rect x="748" y="68" width="170" height="116" rx="16" fill="#1e293b" stroke="#334155"/>
    <rect x="274" y="88" width="150" height="76" rx="15" fill="#172033" stroke="#f97316" stroke-width="2"/>
    <rect x="536" y="88" width="150" height="76" rx="15" fill="#172033" stroke="#8b5cf6" stroke-width="2"/>
  </g>
  <path d="M212 126h54" stroke="#f97316" stroke-width="6" stroke-linecap="round" marker-end="url(#arrow-orange)"/>
  <path d="M424 126h104M686 126h54" stroke="#8b5cf6" stroke-width="6" stroke-linecap="round" marker-end="url(#arrow)"/>
  <text x="127" y="115" fill="#f8fafc" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="20" font-weight="700">Files</text>
  <text x="127" y="143" fill="#94a3b8" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="14">reader thread</text>
  <text x="349" y="117" fill="#f8fafc" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="17" font-weight="700">Registered</text>
  <text x="349" y="141" fill="#f8fafc" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="17" font-weight="700">memory</text>
  <text x="480" y="76" fill="#cbd5e1" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="14" font-weight="700">ONE RC QUEUE PAIR</text>
  <text x="480" y="179" fill="#cbd5e1" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,monospace" font-size="13">RDMA_WRITE_WITH_IMM</text>
  <text x="611" y="117" fill="#f8fafc" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="17" font-weight="700">RAM staging</text>
  <text x="611" y="141" fill="#94a3b8" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="14">credit window</text>
  <text x="833" y="115" fill="#f8fafc" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="20" font-weight="700">Disk</text>
  <text x="833" y="143" fill="#94a3b8" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="14">writer thread</text>
  <text x="480" y="217" fill="#64748b" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="14">control + data plane · no TCP · adaptive flow control</text>
</svg>
