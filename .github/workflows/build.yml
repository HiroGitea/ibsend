name: Build

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  linux:
    name: Linux · CLI + GUI
    runs-on: ubuntu-22.04

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install RDMA and desktop dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            libibverbs-dev \
            librdmacm-dev \
            libwayland-dev \
            libxkbcommon-dev

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build data
        uses: Swatinem/rust-cache@v2

      - name: Run tests
        run: cargo test --locked

      - name: Build release binaries
        run: cargo build --locked --release --features gui

      - name: Upload Linux binaries
        uses: actions/upload-artifact@v4
        with:
          name: ibsend-linux-x86_64
          if-no-files-found: error
          path: |
            target/release/ibsend
            target/release/ibsend-gui
            README.md
            docs/README.zh-CN.md
            docs/README.ja.md
            LICENSE-MIT
            LICENSE-APACHE

  container:
    name: Container image · Kubernetes files
    runs-on: ubuntu-22.04

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Build image
        run: docker build -t ibsend:ci .

      # 没给 IPC_LOCK 时入口脚本要退回普通二进制，而不是 execve 失败
      - name: Check image entrypoint
        run: |
          docker run --rm ibsend:ci authorize
          docker run --rm --cap-drop ALL --cap-add IPC_LOCK ibsend:ci authorize 2>&1 \
            | tee /dev/stderr | grep -q '已经有内存锁定权限'

      - name: Check shell scripts
        run: shellcheck deploy/docker/entrypoint.sh deploy/kubernetes/render.sh contrib/kubectl-ibsend

      - name: Install Helm
        uses: azure/setup-helm@v4

      - name: Lint Helm chart
        run: helm lint --strict deploy/helm/ibsend

      - name: Check rendered manifests are up to date
        run: |
          deploy/kubernetes/render.sh
          git diff --exit-code deploy/kubernetes
