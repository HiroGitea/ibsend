# 场景：把一个 PVC 的内容通过 IB 搬到另一个 PVC（换存储类、跨节点迁移等）。
#
# 更省事的做法是 kubectl 插件，它会自动建、等、清理这两个 Pod：
#   kubectl ibsend cp -n ibsend pvc/old-data pvc/new-data
# 这个文件展示的是不装插件时的同一套流程：
#   1. 接收 Pod 挂目标 PVC，跑一次性的 `ibsend recv`，收完一次就以退出码结束
#      （0 成功，3 表示有文件 CRC 校验失败）
#   2. 发送 Job 挂源 PVC，等接收端出现在发现结果里，再把源卷根目录下的内容
#      一次性发过去（包括点文件，跳过 lost+found）
#
# 使用：把 old-data / new-data 改成实际的 PVC 名，然后
#   kubectl apply -f deploy/kubernetes/examples/pvc-migrate.yaml
#   kubectl -n ibsend logs -f job/pvc-migrate-src
#   kubectl -n ibsend get pod pvc-migrate-dst   # Completed 表示接收端也成功了
#   kubectl -n ibsend delete -f deploy/kubernetes/examples/pvc-migrate.yaml
#
# 注意：
#   - 端口用 18600：hostNetwork 下同一节点上的 daemon 已经占了 18515。
#     同时跑多个迁移时，每一对都要换一个端口，发现名也要不同
#   - RWO 的 PVC 如果正被别的 Pod 挂着，发送/接收 Pod 必须调度到同一节点，
#     见下面注释掉的 affinity（ReadWriteOncePod 的卷则必须先停掉原来的 Pod）
#   - 只搬文件内容和相对路径：权限、属主、时间戳、符号链接都不保留，
#     新文件归 10001:10001 所有。源文件属于别的用户时，把发送端的
#     runAsUser 改成属主，必要时改成 0（同时去掉 runAsNonRoot）
#   - 接收端的内存池按 memory limit 自适应（约 1/3），给大一些能吸收磁盘抖动
#   - 发送 Job 失败时（例如源卷是空的），接收 Pod 会一直等下去，要用上面的
#     delete 命令手动清理
#
# 切换到 Multus：两个 Pod 都删掉 hostNetwork 和 dnsPolicy，在 metadata 里加
#   annotations:
#     k8s.v1.cni.cncf.io/networks: ipoib-network
# 各自有独立地址后，端口也可以保持默认的 18515。
apiVersion: v1
kind: Pod
metadata:
  name: pvc-migrate-dst
  namespace: ibsend
  labels:
    app.kubernetes.io/name: ibsend
    app.kubernetes.io/component: transfer
spec:
  restartPolicy: Never
  # rdma_cm 按 IP 找 HCA，Pod 的网络命名空间里必须有 IPoIB 接口
  hostNetwork: true
  dnsPolicy: ClusterFirstWithHostNet
  automountServiceAccountToken: false
  securityContext:
    runAsUser: 10001
    runAsGroup: 10001
    runAsNonRoot: true
    fsGroup: 10001
    seccompProfile:
      type: RuntimeDefault
  # affinity:
  #   nodeAffinity:
  #     requiredDuringSchedulingIgnoredDuringExecution:
  #       nodeSelectorTerms:
  #         - matchFields:
  #             - key: metadata.name
  #               operator: In
  #               values: [node-where-new-data-is-mounted]
  containers:
    - name: ibsend
      image: ibsend:0.1.0
      args:
        - recv
        - --out
        - /data
        - --port
        - "18600"
        - --name
        - pvc-migrate-dst
        - --ready-file
        - /run/ibsend/ready
      securityContext:
        # 必须为 true：ibsend 靠文件能力拿 IPC_LOCK，no_new_privs 会让它失效
        allowPrivilegeEscalation: true
        readOnlyRootFilesystem: true
        capabilities:
          drop: [ALL]
          add: [IPC_LOCK]
      resources:
        limits:
          memory: 8Gi
          rdma/hca_shared_devices_a: 1
      # 内存池注册完成后才会创建就绪文件
      readinessProbe:
        exec:
          command: ["test", "-f", "/run/ibsend/ready"]
        periodSeconds: 2
      volumeMounts:
        - name: data
          mountPath: /data
        - name: run
          mountPath: /run/ibsend
        - name: tmp
          mountPath: /tmp
  volumes:
    - name: data
      persistentVolumeClaim:
        claimName: new-data
    - name: run
      emptyDir:
        medium: Memory
        sizeLimit: 1Mi
    - name: tmp
      emptyDir: {}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: pvc-migrate-src
  namespace: ibsend
spec:
  # 失败了不要自动重来：先看日志。重新 apply 时已经完整的文件会被跳过，.part 会续传
  backoffLimit: 0
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ibsend
        app.kubernetes.io/component: transfer
    spec:
      restartPolicy: Never
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      automountServiceAccountToken: false
      securityContext:
        # 要能读源卷里的所有文件，见文件开头的说明
        runAsUser: 10001
        runAsGroup: 10001
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      # affinity:
      #   nodeAffinity:
      #     requiredDuringSchedulingIgnoredDuringExecution:
      #       nodeSelectorTerms:
      #         - matchFields:
      #             - key: metadata.name
      #               operator: In
      #               values: [node-where-old-data-is-mounted]
      containers:
        - name: send
          image: ibsend:0.1.0
          env:
            - name: TARGET
              value: pvc-migrate-dst
            - name: PORT
              value: "18600"
            # 等接收端就绪的最长时间（秒）
            - name: WAIT_SECONDS
              value: "600"
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -u
              # 接收端注册完内存池才会应答探测，所以轮询发现结果；
              # peer 事件的字段顺序固定为 event、name、addr
              deadline=$(( $(date +%s) + WAIT_SECONDS ))
              while :; do
                  addr=$(ibsend discover --port "$PORT" --json \
                      | sed -n 's/^{"event":"peer","name":"'"$TARGET"'","addr":"\([^"]*\)".*/\1/p' \
                      | head -n 1)
                  [ -n "$addr" ] && break
                  if [ "$(date +%s)" -ge "$deadline" ]; then
                      echo "等了 $WAIT_SECONDS 秒还没发现 $TARGET" >&2
                      exit 4
                  fi
                  sleep 5
              done
              echo "接收端 $TARGET 在 $addr"

              # 发送卷根目录下的内容，而不是 /src 这个目录本身；一次调用传完，
              # 接收端的 recv 只接一次传输
              set --
              for f in /src/* /src/.[!.]* /src/..?*; do
                  [ -e "$f" ] || continue
                  [ "${f##*/}" = lost+found ] && continue
                  set -- "$@" "$f"
              done
              if [ "$#" -eq 0 ]; then
                  echo "源卷是空的" >&2
                  exit 1
              fi
              exec ibsend send --port "$PORT" "$addr" "$@"
          securityContext:
            allowPrivilegeEscalation: true
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
              add: [IPC_LOCK]
          resources:
            limits:
              memory: 2Gi
              rdma/hca_shared_devices_a: 1
          volumeMounts:
            - name: src
              mountPath: /src
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: src
          persistentVolumeClaim:
            claimName: old-data
            readOnly: true
        - name: tmp
          emptyDir: {}
